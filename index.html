<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="theme-color" content="#0B6B4F">

<title>Family Maintenance</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:#f4f7f6;
  color:#17211e;
}

body{
  padding-bottom:78px;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}


/* =====================================================
   APP
===================================================== */

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#f4f7f6;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  padding:20px 17px 13px;
}

.header-title{
  font-size:23px;
  font-weight:850;
  letter-spacing:-.6px;
}

.header-subtitle{
  margin-top:3px;
  color:#7a8581;
  font-size:12px;
}


/* =====================================================
   REALISTIC ATM / BANK CARD
===================================================== */

.total-card-wrap{
  padding:0 15px 20px;
}

.total-card{
  position:relative;

  width:100%;

  aspect-ratio:1.586 / 1;

  min-height:205px;

  padding:20px 21px;

  border-radius:20px;

  overflow:hidden;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #0d7658 0%,
      #0B6B4F 38%,
      #07553f 72%,
      #043d2e 100%
    );

  border:
    1px solid
    rgba(255,255,255,.20);

  box-shadow:
    0 18px 35px
    rgba(0,45,32,.28),

    0 5px 10px
    rgba(0,0,0,.10);

  isolation:isolate;
}


/* -----------------------------------------------
   CARD LIGHT / SECURITY EFFECT
------------------------------------------------ */

.total-card::before{
  content:"";

  position:absolute;

  inset:-30%;

  z-index:-1;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(255,255,255,.20),
      transparent 25%
    ),

    radial-gradient(
      circle at 90% 90%,
      rgba(0,0,0,.18),
      transparent 35%
    );

  transform:rotate(-8deg);
}


/* -----------------------------------------------
   DIAGONAL SECURITY LINES
------------------------------------------------ */

.total-card::after{
  content:"";

  position:absolute;

  inset:0;

  z-index:-1;

  opacity:.16;

  background:
    repeating-linear-gradient(
      125deg,
      transparent 0px,
      transparent 12px,
      rgba(255,255,255,.16) 13px,
      transparent 14px
    );
}


/* -----------------------------------------------
   CARD TOP
------------------------------------------------ */

.card-top{
  position:relative;

  z-index:5;

  display:flex;

  align-items:flex-start;

  justify-content:space-between;
}


/* -----------------------------------------------
   CARD BRAND
------------------------------------------------ */

.card-brand{
  font-size:11px;

  font-weight:900;

  letter-spacing:1.8px;

  color:
    rgba(255,255,255,.92);

  text-shadow:
    0 1px 2px
    rgba(0,0,0,.25);
}


/* -----------------------------------------------
   CONTACTLESS SYMBOL
------------------------------------------------ */

.card-contactless{
  position:absolute;

  right:60px;

  top:1px;

  font-size:18px;

  line-height:1;

  opacity:.82;

  transform:rotate(90deg);
}


/* -----------------------------------------------
   EMV CHIP
------------------------------------------------ */

.card-chip{
  width:43px;
  height:33px;

  border-radius:8px;

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #f1e5b9,
      #c6b579 45%,
      #e7d79e 70%,
      #aa975e
    );

  border:
    1px solid
    rgba(90,70,25,.35);

  box-shadow:
    inset 0 1px 1px
    rgba(255,255,255,.65),

    0 2px 4px
    rgba(0,0,0,.20);
}


/* chip vertical lines */

.card-chip::before{
  content:"";

  position:absolute;

  inset:0;

  background:

    linear-gradient(
      90deg,
      transparent 31%,
      rgba(85,70,35,.38) 32%,
      rgba(85,70,35,.38) 34%,
      transparent 35%,
      transparent 65%,
      rgba(85,70,35,.38) 66%,
      rgba(85,70,35,.38) 68%,
      transparent 69%
    ),

    linear-gradient(
      0deg,
      transparent 47%,
      rgba(85,70,35,.38) 48%,
      rgba(85,70,35,.38) 52%,
      transparent 53%
    );
}


/* chip center */

.card-chip::after{
  content:"";

  position:absolute;

  width:14px;
  height:14px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  border:
    1px solid
    rgba(85,70,35,.45);

  border-radius:4px;
}


/* -----------------------------------------------
   CARD MAIN
------------------------------------------------ */

.card-middle{
  position:relative;

  z-index:5;

  margin-top:17px;
}


/* -----------------------------------------------
   TOTAL LABEL
------------------------------------------------ */

.total-label{
  font-size:9px;

  letter-spacing:1.4px;

  font-weight:800;

  opacity:.65;

  text-transform:uppercase;
}


/* -----------------------------------------------
   TOTAL AMOUNT
------------------------------------------------ */

.total-amount{
  margin-top:3px;

  font-size:29px;

  line-height:1.05;

  font-weight:900;

  letter-spacing:-.8px;

  text-shadow:
    0 2px 4px
    rgba(0,0,0,.22);
}


/* -----------------------------------------------
   CARD NUMBER
------------------------------------------------ */

.card-number{
  margin-top:11px;

  font-size:14px;

  letter-spacing:3px;

  font-weight:650;

  color:
    rgba(255,255,255,.78);

  text-shadow:
    0 1px 2px
    rgba(0,0,0,.22);
}


/* -----------------------------------------------
   CARD BOTTOM
------------------------------------------------ */

.card-bottom{
  position:absolute;

  z-index:5;

  left:21px;
  right:21px;
  bottom:17px;

  display:flex;

  align-items:flex-end;

  justify-content:space-between;
}


/* -----------------------------------------------
   VALID THRU
------------------------------------------------ */

.card-valid{
  margin-right:22px;
}

.card-valid-label{
  font-size:6px;

  letter-spacing:.8px;

  opacity:.55;
}

.card-valid-value{
  margin-top:2px;

  font-size:9px;

  font-weight:750;

  letter-spacing:.5px;
}


/* -----------------------------------------------
   CARD HOLDER
------------------------------------------------ */

.card-holder-label{
  font-size:6px;

  opacity:.52;

  letter-spacing:1px;
}

.card-holder{
  margin-top:2px;

  font-size:10px;

  font-weight:800;

  letter-spacing:.7px;

  text-transform:uppercase;
}


/* -----------------------------------------------
   CARD COUNT
------------------------------------------------ */

.card-count{
  position:absolute;

  right:0;

  bottom:0;

  font-size:8px;

  opacity:.62;

  font-weight:700;

  letter-spacing:.3px;
}


/* -----------------------------------------------
   NETWORK MARK
------------------------------------------------ */

.card-network{
  position:absolute;

  right:21px;

  bottom:14px;

  font-size:10px;

  font-weight:900;

  letter-spacing:-.5px;

  font-style:italic;

  opacity:.9;
}


/* -----------------------------------------------
   SMALL MOBILE
------------------------------------------------ */

@media(max-width:360px){

  .total-card{
    min-height:190px;

    padding:
      17px 18px;
  }

  .total-amount{
    font-size:26px;
  }

  .card-number{
    font-size:12px;

    letter-spacing:2.5px;
  }

  .card-chip{
    width:39px;
    height:30px;
  }

}




/* =====================================================
   PAGE
===================================================== */

.page{
  display:none;

  padding-bottom:18px;
}

.page.active{
  display:block;
}


/* =====================================================
   SECTION
===================================================== */

.section{
  padding:0 15px;

  margin-bottom:17px;
}

.section-title{
  margin-bottom:8px;

  font-size:13px;

  font-weight:800;
}


/* =====================================================
   CATEGORY
===================================================== */

.category-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;
}

.category-card{
  min-height:65px;

  padding:9px;

  border-radius:16px;

  border:1.5px solid #e0e7e4;

  background:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:3px;

  transition:.18s;

  box-shadow:
    0 4px 10px
    rgba(30,55,45,.035);
}

.category-icon{
  font-size:20px;

  line-height:1;
}

.category-name{
  font-size:13px;

  font-weight:800;
}

.category-card.selected{
  border-color:#0B6B4F;

  background:#eaf6f1;

  color:#0B6B4F;

  box-shadow:
    0 5px 14px
    rgba(11,107,79,.11);
}


/* =====================================================
   PAYMENT
===================================================== */

.payment-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;
}

.payment-card{
  min-height:76px;

  padding:8px 4px;

  border-radius:15px;

  border:1.5px solid #e0e7e4;

  background:#fff;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:6px;

  transition:.18s;

  box-shadow:
    0 4px 10px
    rgba(30,55,45,.035);
}

.payment-card:active{
  transform:scale(.96);
}

.payment-icon{
  width:35px;
  height:35px;

  border-radius:10px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;
}

.payment-icon img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.payment-icon-text{
  width:35px;
  height:35px;

  border-radius:10px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:11px;

  font-weight:900;

  color:#fff;
}

.bank-placeholder{
  background:#0B6B4F;
}

.cash-placeholder{
  background:#59656A;
}

.payment-name{
  font-size:10px;

  font-weight:800;
}


/* =====================================================
   TRANSACTIONS
===================================================== */

.filter-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-bottom:10px;
}

.filter-box{
  width:100%;

  border:1px solid #dfe7e3;

  background:#fff;

  border-radius:13px;

  padding:10px;

  outline:none;

  font-size:12px;

  color:#17211e;
}

.summary-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:7px;

  margin-bottom:13px;
}

.summary-card{
  background:#fff;

  border:1px solid #e3e9e7;

  border-radius:14px;

  padding:10px 6px;

  text-align:center;
}

.summary-label{
  font-size:9px;

  color:#7b8582;

  font-weight:750;
}

.summary-value{
  margin-top:3px;

  font-size:12px;

  font-weight:850;
}

.transaction-list{
  display:flex;

  flex-direction:column;

  gap:8px;
}

.transaction-card{
  background:#fff;

  border:1px solid #e3e9e7;

  border-radius:16px;

  padding:12px;
}

.transaction-top{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;
}

.transaction-left{
  display:flex;

  align-items:center;

  gap:9px;

  min-width:0;
}

.transaction-payment-icon{
  width:38px;
  height:38px;

  border-radius:11px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:none;

  overflow:hidden;
}

.transaction-payment-icon
.payment-icon-text{
  width:38px;
  height:38px;
}

.transaction-info{
  min-width:0;
}

.transaction-category{
  font-size:12px;

  font-weight:800;
}

.transaction-date{
  margin-top:2px;

  color:#8a9491;

  font-size:10px;
}

.transaction-amount{
  white-space:nowrap;

  font-size:14px;

  font-weight:850;

  color:#0B6B4F;
}

.transaction-note{
  margin-top:8px;

  padding-top:7px;

  border-top:
    1px solid #eef1f0;

  color:#66716d;

  font-size:10px;

  line-height:1.45;
}

.empty{
  padding:35px 15px;

  text-align:center;

  color:#8a9491;

  font-size:13px;

  background:#fff;

  border-radius:17px;

  border:1px dashed #dce5e1;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
  position:fixed;

  z-index:50;

  bottom:0;

  left:50%;

  transform:
    translateX(-50%);

  width:100%;

  max-width:520px;

  height:70px;

  padding:
    7px 18px 9px;

  background:
    rgba(255,255,255,.97);

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

  border-top:
    1px solid #e3e9e7;

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

.nav-btn{
  border-radius:15px;

  background:transparent;

  color:#8a9491;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:3px;

  font-size:10px;

  font-weight:750;
}

.nav-icon{
  font-size:19px;

  line-height:1;
}

.nav-btn.active{
  color:#0B6B4F;

  background:#edf7f3;
}


/* =====================================================
   EXPENSE POPUP
===================================================== */

.modal-bg{
  position:fixed;

  z-index:100;

  inset:0;

  background:
    rgba(0,0,0,.42);

  display:none;

  align-items:flex-end;

  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;

  max-width:520px;

  background:#fff;

  border-radius:
    25px 25px 0 0;

  padding:
    16px 16px
    calc(18px + env(safe-area-inset-bottom));

  max-height:92vh;

  overflow:auto;

  animation:
    popupUp .22s ease-out;
}

@keyframes popupUp{

  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }

}

.modal-handle{
  width:40px;
  height:4px;

  border-radius:20px;

  background:#d8dfdc;

  margin:0 auto 14px;
}

.modal-title{
  font-size:18px;

  font-weight:850;

  margin-bottom:13px;
}

.selected-info{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  padding:11px 12px;

  border-radius:14px;

  background:#edf7f3;

  border:1px solid #d6ebe3;

  color:#0B6B4F;

  font-size:12px;

  font-weight:800;

  margin-bottom:14px;
}

.selected-info-arrow{
  opacity:.5;
}

.modal-field{
  margin-bottom:12px;
}

.modal-label{
  display:block;

  margin-bottom:6px;

  font-size:12px;

  font-weight:800;

  color:#4e5b56;
}

.input-box{
  width:100%;

  border:1px solid #e0e7e4;

  background:#fff;

  border-radius:13px;

  padding:12px 13px;

  outline:none;

  color:#17211e;
}

.input-box:focus{
  border-color:#0B6B4F;

  box-shadow:
    0 0 0 3px
    rgba(11,107,79,.08);
}

.modal-amount-wrap{
  position:relative;
}

.modal-amount{
  width:100%;

  border:1.5px solid #dfe7e3;

  background:#fff;

  border-radius:15px;

  padding:
    14px 55px
    14px 14px;

  outline:none;

  font-size:23px;

  font-weight:850;

  color:#17211e;
}

.modal-amount:focus{
  border-color:#0B6B4F;

  box-shadow:
    0 0 0 3px
    rgba(11,107,79,.07);
}

.modal-currency{
  position:absolute;

  right:15px;

  top:50%;

  transform:
    translateY(-50%);

  color:#7a8581;

  font-size:12px;

  font-weight:850;
}

.modal-note{
  min-height:70px;

  resize:none;
}

.modal-save{
  width:100%;

  min-height:52px;

  margin-top:3px;

  border-radius:15px;

  background:#0B6B4F;

  color:#fff;

  font-size:15px;

  font-weight:850;

  box-shadow:
    0 9px 20px
    rgba(11,107,79,.20);
}

.modal-save:active{
  transform:scale(.98);
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;

  z-index:200;

  left:50%;

  bottom:83px;

  transform:
    translateX(-50%)
    translateY(15px);

  background:#17211e;

  color:#fff;

  padding:
    10px 16px;

  border-radius:12px;

  font-size:12px;

  font-weight:700;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  white-space:nowrap;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:360px){

  .payment-grid{
    gap:5px;
  }

  .payment-card{
    min-height:72px;
  }

  .payment-name{
    font-size:9px;
  }

  .total-card{
    min-height:180px;
  }

  .total-amount{
    font-size:27px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HOME
===================================================== -->

<section
  id="homePage"
  class="page active"
>

  <header class="header">

    <div class="header-title">
      Family Maintenance
    </div>

    <div class="header-subtitle">
      পরিবারের খরচের হিসাব
    </div>

  </header>


  <!-- =================================================
       ATM TOTAL CARD
  ================================================== -->
<div class="total-card-wrap">

  <div class="total-card">


    <!-- CARD TOP -->

    <div class="card-top">

      <div class="card-brand">
        FAMILY MAINTENANCE
      </div>

      <div class="card-contactless">
        ))) 
      </div>

      <div class="card-chip"></div>

    </div>


    <!-- CARD MAIN -->

    <div class="card-middle">

      <div class="total-label">
        TOTAL EXPENSE
      </div>

      <div
        id="totalExpense"
        class="total-amount"
      >
        0 TK
      </div>

      <div class="card-number">
        4827&nbsp;&nbsp;••••&nbsp;&nbsp;••••&nbsp;&nbsp;FM01
      </div>

    </div>


    <!-- CARD BOTTOM -->

    <div class="card-bottom">

      <div>

        <div class="card-holder-label">
          CARD HOLDER
        </div>

        <div class="card-holder">
          FAMILY EXPENSE
        </div>

      </div>


      <div class="card-valid">

        <div class="card-valid-label">
          VALID THRU
        </div>

        <div class="card-valid-value">
          09/30
        </div>

      </div>


      <div
        id="totalCount"
        class="card-count"
      >
        0 Transactions
      </div>


      <div class="card-network">
        FM
      </div>

    </div>

  </div>

</div>



  <!-- =================================================
       CATEGORY
  ================================================== -->

  <div class="section">

    <div class="section-title">
      Category
    </div>


    <div class="category-grid">

      <button
        type="button"
        class="category-card selected"
        data-category="Family"
      >

        <div class="category-icon">
          👨‍👩‍👧
        </div>

        <div class="category-name">
          Family
        </div>

      </button>


      <button
        type="button"
        class="category-card"
        data-category="Wife"
      >

        <div class="category-icon">
          👩
        </div>

        <div class="category-name">
          Wife
        </div>

      </button>

    </div>

  </div>


  <!-- =================================================
       PAYMENT
  ================================================== -->

  <div class="section">

    <div class="section-title">
      Payment Method
    </div>


    <div class="payment-grid">


      <!-- BKASH -->

      <button
        type="button"
        class="payment-card"
        data-payment="বিকাশ"
      >

        <div class="payment-icon">

          <img
            src="bkash-logo.svg"
            alt="bKash"
          >

        </div>

        <div class="payment-name">
          বিকাশ
        </div>

      </button>


      <!-- NAGAD -->

      <button
        type="button"
        class="payment-card"
        data-payment="নগদ"
      >

        <div class="payment-icon">

          <img
            src="nagad-logo.svg"
            alt="Nagad"
          >

        </div>

        <div class="payment-name">
          নগদ
        </div>

      </button>


      <!-- BANK -->

      <button
        type="button"
        class="payment-card"
        data-payment="ব্যাংক"
      >

        <div class="payment-icon">

          <div
            class="
              payment-icon-text
              bank-placeholder
            "
          >
            BANK
          </div>

        </div>

        <div class="payment-name">
          ব্যাংক
        </div>

      </button>


      <!-- CASH -->

      <button
        type="button"
        class="payment-card"
        data-payment="ক্যাশ"
      >

        <div class="payment-icon">

          <div
            class="
              payment-icon-text
              cash-placeholder
            "
          >
            ৳
          </div>

        </div>

        <div class="payment-name">
          ক্যাশ
        </div>

      </button>

<section

>

  <header class="header">

<!-- =====================================================
     EXPENSE POPUP
===================================================== -->

<div
  id="expenseModal"
  class="modal-bg"
>

  <div class="modal">

    <div class="modal-handle"></div>


    <div class="modal-title">
      Add Expense
    </div>


    <div class="selected-info">

      <span id="popupCategory">
        Family
      </span>

      <span class="selected-info-arrow">
        ─────
      </span>

      <span id="popupPayment">
        বিকাশ
      </span>

    </div>


    <!-- DATE -->

    <div class="modal-field">

      <label
        class="modal-label"
        for="popupDate"
      >
        তারিখ
      </label>

      <input
        id="popupDate"
        class="input-box"
        type="date"
      >

    </div>


    <!-- AMOUNT -->

    <div class="modal-field">

      <label

      >
        Amount
      </label>

      <div class="modal-amount-wrap">

        <input
          id="popupAmount"
          class="modal-amount"
          type="number"
          inputmode="numeric"
          min="0"

        <span class="modal-currency">
          TK
        </span>

      >

      </label>

      <textarea
        id="popupNote"

        placeholder="খরচের বিস্তারিত লিখুন..."
      ></textarea>

    </div>

    <button

      type="button"
    >
      SAVE EXPENSE
    </button>

<!-- =====================================================
     TOAST
===================================================== -->

<div
  id="toast"
  class="toast"
></div>



<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "familyMaintenance_transactions_v2";


/* =====================================================
   STATE
===================================================== */

let transactions = [];

let selectedCategory =
  "Family";

let selectedPayment =
  "";


/* =====================================================
   SCROLL MEMORY
===================================================== */

let savedHomeScroll =
  0;


/* =====================================================
   DOM
===================================================== */

const homePage =
  document.getElementById(
    "homePage"
  );

const transactionsPage =
  document.getElementById(
    "transactionsPage"
  );

const homeNav =
  document.getElementById(
    "homeNav"
  );

const transactionsNav =
  document.getElementById(
    "transactionsNav"
  );

const totalExpense =
  document.getElementById(
    "totalExpense"
  );

const totalCount =
  document.getElementById(
    "totalCount"
  );

const transactionList =
  document.getElementById(
    "transactionList"
  );

const monthFilter =
  document.getElementById(
    "monthFilter"
  );

const categoryFilter =
  document.getElementById(
    "categoryFilter"
  );

const paymentFilter =
  document.getElementById(
    "paymentFilter"
  );

const familyTotal =
  document.getElementById(
    "familyTotal"
  );

const wifeTotal =
  document.getElementById(
    "wifeTotal"
  );

const filteredTotal =
  document.getElementById(
    "filteredTotal"
  );


/* =====================================================
   POPUP DOM
===================================================== */

const expenseModal =
  document.getElementById(
    "expenseModal"
  );

const popupCategory =
  document.getElementById(
    "popupCategory"
  );

const popupPayment =
  document.getElementById(
    "popupPayment"
  );

const popupDate =
  document.getElementById(
    "popupDate"
  );

const popupAmount =
  document.getElementById(
    "popupAmount"
  );

const popupNote =
  document.getElementById(
    "popupNote"
  );

const popupSave =
  document.getElementById(
    "popupSave"
  );

const toast =
  document.getElementById(
    "toast"
  );


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  init
);


function init(){

  loadTransactions();

  setToday();

  setupCategoryButtons();

  setupPaymentButtons();

  setupNavigation();

  setupFilters();

  setupPopup();

  refreshUI();

}


/* =====================================================
   TODAY
===================================================== */

function getToday(){

  return new Date()
    .toISOString()
    .split("T")[0];

}


function setToday(){

  popupDate.value =
    getToday();

}


/* =====================================================
   LOAD
===================================================== */

function loadTransactions(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(saved){

      const data =
        JSON.parse(saved);

      if(
        Array.isArray(data)
      ){

        transactions =
          data;

      }

    }

  }catch(error){

    console.error(
      "Storage load error:",
      error
    );

    transactions = [];

  }

}


/* =====================================================
   SAVE STORAGE
===================================================== */

function saveTransactions(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      transactions
    )
  );

}


/* =====================================================
   ID
===================================================== */

function createTransactionId(){

  const timestamp =
    Date.now();

  const random =
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  return (
    "TXN-" +
    timestamp +
    "-" +
    random
  );

}


/* =====================================================
   CATEGORY BUTTONS
===================================================== */

function setupCategoryButtons(){

  document
    .querySelectorAll(
      ".category-card"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".category-card"
            )
            .forEach(item => {

              item.classList.remove(
                "selected"
              );

            });

          button.classList.add(
            "selected"
          );

          selectedCategory =
            button.dataset.category;

        }
      );

    });

}


/* =====================================================
   PAYMENT BUTTONS
===================================================== */

function setupPaymentButtons(){

  document
    .querySelectorAll(
      ".payment-card"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          selectedPayment =
            button.dataset.payment;

          openExpensePopup();

        }
      );

    });

}


/* =====================================================
   OPEN POPUP
===================================================== */

function openExpensePopup(){

  savedHomeScroll =
    window.scrollY;


  popupCategory.textContent =
    selectedCategory;

  popupPayment.textContent =
    selectedPayment;


  popupDate.value =
    getToday();

  popupAmount.value =
    "";

  popupNote.value =
    "";


  expenseModal.classList.add(
    "show"
  );


  /*
    Give Android a moment to open
    the keyboard correctly.
  */

  setTimeout(
    () => {

      popupAmount.focus();

      scrollPopupToAmount();

    },
    180
  );

}


/* =====================================================
   POPUP SETUP
===================================================== */

function setupPopup(){

  popupSave.addEventListener(
    "click",
    saveExpense
  );


  /*
    Android keyboard Done button
  */

  popupAmount.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        saveExpense();

      }

    }
  );


  popupNote.addEventListener(
    "keydown",
    event => {

      /*
        Ctrl/Enter বা keyboard
        submit style behaviour.
      */

      if(
        event.key === "Enter" &&
        event.ctrlKey
      ){

        event.preventDefault();

        saveExpense();

      }

    }
  );


  /*
    Tap outside popup to close.
  */

  expenseModal.addEventListener(
    "click",
    event => {

      if(
        event.target ===
        expenseModal
      ){

        closeExpensePopup();

      }

    }
  );

}


/* =====================================================
   POPUP SCROLL / KEYBOARD SUPPORT
===================================================== */

function scrollPopupToAmount(){

  setTimeout(
    () => {

      popupAmount.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },
    100
  );

}


/*
  When Android keyboard changes
  viewport height, keep Save button
  visible above keyboard.
*/

if(
  window.visualViewport
){

  window.visualViewport.addEventListener(
    "resize",
    keepPopupVisible
  );

  window.visualViewport.addEventListener(
    "scroll",
    keepPopupVisible
  );

}


function keepPopupVisible(){

  if(
    !expenseModal.classList.contains(
      "show"
    )
  ){

    return;

  }


  setTimeout(
    () => {

      popupSave.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },
    60
  );

}


/* =====================================================
   CLOSE POPUP
===================================================== */

function closeExpensePopup(){

  /*
    Remove keyboard
  */

  if(
    document.activeElement
  ){

    document.activeElement.blur();

  }


  expenseModal.classList.remove(
    "show"
  );


  /*
    Restore previous Home position
  */

  setTimeout(
    () => {

      window.scrollTo(
        0,
        savedHomeScroll
      );

    },
    80
  );

}


/* =====================================================
   SAVE EXPENSE
===================================================== */

function saveExpense(){

  const date =
    popupDate.value;

  const amount =
    parseInt(
      popupAmount.value,
      10
    );

  const note =
    popupNote.value.trim();


  if(!date){

    showToast(
      "তারিখ নির্বাচন করুন"
    );

    popupDate.focus();

    return;

  }


  if(
    !amount ||
    amount <= 0
  ){

    showToast(
      "সঠিক Amount দিন"
    );

    popupAmount.focus();

    return;

  }


  const transaction = {

    id:
      createTransactionId(),

    date:
      date,

    category:
      selectedCategory,

    payment:
      selectedPayment,

    amount:
      amount,

    note:
      note,

    createdAt:
      new Date().toISOString(),

    updatedAt:
      new Date().toISOString()

  };


  /*
    Save locally first
  */

  transactions.unshift(
    transaction
  );


  saveTransactions();


  /*
    Close popup
  */

  closeExpensePopup();


  /*
    Update all UI
  */

  refreshUI();


  /*
    Small confirmation
  */

  setTimeout(
    () => {

      showToast(
        "Expense Saved ✓"
      );

    },
    180
  );

}


/* =====================================================
   NAVIGATION
===================================================== */

function setupNavigation(){

  homeNav.addEventListener(
    "click",
    () => {

      showPage(
        "home"
      );

    }
  );


  transactionsNav.addEventListener(
    "click",
    () => {

      showPage(
        "transactions"
      );

    }
  );

}


function showPage(page){

  if(
    page === "home"
  ){

    homePage.classList.add(
      "active"
    );

    transactionsPage.classList.remove(
      "active"
    );

    homeNav.classList.add(
      "active"
    );

    transactionsNav.classList.remove(
      "active"
    );

  }

  else{

    homePage.classList.remove(
      "active"
    );

    transactionsPage.classList.add(
      "active"
    );

    homeNav.classList.remove(
      "active"
    );

    transactionsNav.classList.add(
      "active"
    );

    populateMonthFilter();

    renderTransactions();

    window.scrollTo(
      0,
      0
    );

  }

}


/* =====================================================
   FILTER
===================================================== */

function setupFilters(){

  monthFilter.addEventListener(
    "change",
    renderTransactions
  );

  categoryFilter.addEventListener(
    "change",
    renderTransactions
  );

  paymentFilter.addEventListener(
    "change",
    renderTransactions
  );

}


/* =====================================================
   MONTH FILTER
===================================================== */

function populateMonthFilter(){

  const oldValue =
    monthFilter.value;


  const months =
    [
      ...new Set(
        transactions.map(
          transaction =>
            transaction.date
              .substring(0,7)
        )
      )
    ]
    .sort()
    .reverse();


  monthFilter.innerHTML =
    `
      <option value="all">
        সব Month
      </option>
    `;


  months.forEach(
    month => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        month;

      option.textContent =
        formatMonth(
          month
        );

      monthFilter.appendChild(
        option
      );

    }
  );


  if(
    months.includes(
      oldValue
    )
  ){

    monthFilter.value =
      oldValue;

  }

  else{

    monthFilter.value =
      "all";

  }

}


/* =====================================================
   MONTH FORMAT
===================================================== */

function formatMonth(month){

  const parts =
    month.split("-");

  const year =
    Number(parts[0]);

  const monthNumber =
    Number(parts[1]);

  const date =
    new Date(
      year,
      monthNumber - 1,
      1
    );


  return date.toLocaleDateString(
    "en-US",
    {
      month:"long",
      year:"numeric"
    }
  );

}


/* =====================================================
   FILTER DATA
===================================================== */

function getFilteredTransactions(){

  const month =
    monthFilter.value;

  const category =
    categoryFilter.value;

  const payment =
    paymentFilter.value;


  return transactions.filter(
    transaction => {

      const monthMatch =
        month === "all" ||
        transaction.date
          .startsWith(month);


      const categoryMatch =
        category === "all" ||
        transaction.category ===
          category;


      const paymentMatch =
        payment === "all" ||
        transaction.payment ===
          payment;


      return (
        monthMatch &&
        categoryMatch &&
        paymentMatch
      );

    }
  );

}


/* =====================================================
   RENDER TRANSACTIONS
===================================================== */

function renderTransactions(){

  const filtered =
    getFilteredTransactions();


  updateSummary(
    filtered
  );


  if(
    !filtered.length
  ){

    transactionList.innerHTML =
      `
        <div class="empty">
          কোনো Transaction পাওয়া যায়নি
        </div>
      `;

    return;

  }


  transactionList.innerHTML =
    filtered
      .map(
        transaction =>
          transactionHTML(
            transaction
          )
      )
      .join("");

}


/* =====================================================
   PAYMENT DISPLAY
===================================================== */

function paymentDisplay(
  payment
){

  if(
    payment === "বিকাশ"
  ){

    return `
      <img
        src="bkash-logo.svg"
        alt="bKash"
        style="
          width:100%;
          height:100%;
          object-fit:contain;
        "
      >
    `;

  }


  if(
    payment === "নগদ"
  ){

    return `
      <img
        src="nagad-logo.svg"
        alt="Nagad"
        style="
          width:100%;
          height:100%;
          object-fit:contain;
        "
      >
    `;

  }


  if(
    payment === "ব্যাংক"
  ){

    return `
      <div
        class="
          payment-icon-text
          bank-placeholder
        "
      >
        BANK
      </div>
    `;

  }


  return `
    <div
      class="
        payment-icon-text
        cash-placeholder
      "
    >
      ৳
    </div>
  `;

}


/* =====================================================
   TRANSACTION HTML
===================================================== */

function transactionHTML(
  transaction
){

  return `

    <div class="transaction-card">

      <div class="transaction-top">

        <div class="transaction-left">

          <div
            class="transaction-payment-icon"
          >

            ${paymentDisplay(
              transaction.payment
            )}

          </div>


          <div class="transaction-info">

            <div
              class="transaction-category"
            >

              ${escapeHTML(
                transaction.category
              )}

              ·

              ${escapeHTML(
                transaction.payment
              )}

            </div>


            <div
              class="transaction-date"
            >

              ${formatDate(
                transaction.date
              )}

            </div>

          </div>

        </div>


        <div
          class="transaction-amount"
        >

          ${formatAmount(
            transaction.amount
          )}

          TK

        </div>

      </div>


      ${
        transaction.note
          ?
          `
            <div
              class="transaction-note"
            >
              ${escapeHTML(
                transaction.note
              )}
            </div>
          `
          :
          ""
      }

    </div>

  `;

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(
  list
){

  let family = 0;

  let wife = 0;

  let total = 0;


  list.forEach(
    transaction => {

      const amount =
        Number(
          transaction.amount
        ) || 0;


      total +=
        amount;


      if(
        transaction.category ===
        "Family"
      ){

        family +=
          amount;

      }


      if(
        transaction.category ===
        "Wife"
      ){

        wife +=
          amount;

      }

    }
  );


  familyTotal.textContent =
    formatAmount(
      family
    ) + " TK";


  wifeTotal.textContent =
    formatAmount(
      wife
    ) + " TK";


  filteredTotal.textContent =
    formatAmount(
      total
    ) + " TK";

}


/* =====================================================
   GLOBAL TOTAL
===================================================== */

function updateGlobalTotal(){

  const total =
    transactions.reduce(
      (
        sum,
        transaction
      ) =>
        sum +
        (
          Number(
            transaction.amount
          ) || 0
        ),
      0
    );


  totalExpense.textContent =
    formatAmount(
      total
    ) + " TK";


  totalCount.textContent =
    transactions.length +
    (
      transactions.length === 1
        ?
          " Transaction"
        :
          " Transactions"
    );

}


/* =====================================================
   REFRESH
===================================================== */

function refreshUI(){

  updateGlobalTotal();

  populateMonthFilter();

  renderTransactions();

}


/* =====================================================
   INDIAN NUMBER FORMAT
===================================================== */

function formatAmount(
  value
){

  return Number(
    value || 0
  )
  .toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:0
    }
  );

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(
  date
){

  if(!date){
    return "";
  }


  const parts =
    date.split("-");


  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
  message
){

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1800
    );

}

</script>
